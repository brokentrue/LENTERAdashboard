services:


  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dashboard-rap-app
    volumes:
      - .:/var/www/html
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    networks:
      - rap-network




  nginx:
    image: nginx:alpine
    container_name: dashboard-rap-nginx
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - rap-network

  db:
    image: mysql:8.0
    container_name: dashboard-rap-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - rap-db-data:/var/lib/mysql
    networks:
      - rap-network

networks:
  rap-network:

volumes:
  rap-db-data:
